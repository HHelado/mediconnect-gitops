apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits and Requests
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Garantiza que todos los contenedores declaren solicitudes y limites de CPU y memoria
      para prevenir inanicion de recursos o denegacion de servicio en el nodo.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - argocd
                - argo-rollouts
          - resources:
              names:
                - "*postgresql*"
                - "*nats*"
                - "*cronjob*"
      validate:
        message: "Los limites y solicitudes de CPU y memoria son obligatorios para cada contenedor."
        pattern:
          spec:
            containers:
              - resources:
                  requests:
                    cpu: "?*"
                    memory: "?*"
                  limits:
                    cpu: "?*"
                    memory: "?*"
