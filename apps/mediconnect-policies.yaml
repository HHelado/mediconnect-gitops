apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediconnect-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/HHelado/mediconnect-gitops.git
    targetRevision: master
    path: policies
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
