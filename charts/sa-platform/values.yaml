# 10. Gestion de Secretos con SealedSecrets
sealedSecrets:
  enabled: true
  encryptedUser: "AgB1234567890abcdef=="
  encryptedPassword: "AgB0987654321fedcba=="
  encryptedJwt: "AgB1122334455667788=="
