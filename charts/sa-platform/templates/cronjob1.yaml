{{- if .Values.cronjobs.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sa-platform.fullname" . }}-cronjob1-sa
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "sa-platform.fullname" . }}-cronjob1
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: cronjob1
spec:
  schedule: {{ .Values.cronjobs.cronjob1.schedule | default "*/2 * * * *" | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: cronjob1
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ include "sa-platform.fullname" . }}-cronjob1-sa
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
            - name: cronjob1
              image: "{{ .Values.cronjobs.cronjob1.image.repository }}:{{ .Values.cronjobs.cronjob1.image.tag }}"
              imagePullPolicy: {{ .Values.cronjobs.cronjob1.image.pullPolicy | default "IfNotPresent" }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: STUDENT_CARNET
                  value: {{ .Values.cronjobs.carnet | default "202307629" | quote }}
                - name: DB_HOST
                  value: "{{ .Release.Name }}-postgresql-headless"
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: "cronjobs_db"
                - name: DB_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.fullname" . }}-secrets
                      key: postgres-user
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "sa-platform.fullname" . }}-secrets
                      key: postgres-password
              resources:
                limits:
                  cpu: 100m
                  memory: 128Mi
                requests:
                  cpu: 20m
                  memory: 64Mi
              volumeMounts:
                - name: tmp-volume
                  mountPath: /tmp
          volumes:
            - name: tmp-volume
              emptyDir: {}
{{- end }}
