{{- if .Values.networkPolicies.enabled }}
# 1. Denegacion por defecto de todo el trafico entrante no autorizado
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sa-platform.fullname" . }}-default-deny-ingress
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# 2. Permitir trafico desde Ingress Controller hacia API Gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sa-platform.fullname" . }}-allow-ingress-to-gateway
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# 3. Permitir trafico UNICAMENTE desde API Gateway hacia los microservicios internos
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sa-platform.fullname" . }}-allow-gateway-to-microservices
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["auth-service", "doctors-service", "appointments-service", "lab-results-service"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3004
---
# 4. Permitir trafico a PostgreSQL solo desde microservicios autorizados y cronjobs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sa-platform.fullname" . }}-allow-db-access
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["auth-service", "doctors-service", "appointments-service", "lab-results-service", "cronjob1", "cronjob2"]
      ports:
        - protocol: TCP
          port: 5432
---
# 5. Permitir trafico a Broker NATS solo desde servicios autorizados
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sa-platform.fullname" . }}-allow-broker-access
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: broker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["appointments-service", "lab-results-service", "cronjob2"]
      ports:
        - protocol: TCP
          port: 4222
{{- end }}
