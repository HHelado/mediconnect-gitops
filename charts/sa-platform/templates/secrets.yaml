apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "sa-platform.fullname" . }}-secrets
  labels:
    {{- include "sa-platform.labels" . | nindent 4 }}
spec:
  encryptedData:
    postgres-user: {{ if .Values.sealedSecrets }}{{ .Values.sealedSecrets.encryptedUser | default "AgB1234567890abcdef==" | quote }}{{ else }}"AgB1234567890abcdef=="{{ end }}
    postgres-password: {{ if .Values.sealedSecrets }}{{ .Values.sealedSecrets.encryptedPassword | default "AgB0987654321fedcba==" | quote }}{{ else }}"AgB0987654321fedcba=="{{ end }}
    jwt-secret: {{ if .Values.sealedSecrets }}{{ .Values.sealedSecrets.encryptedJwt | default "AgB1122334455667788==" | quote }}{{ else }}"AgB1122334455667788=="{{ end }}
  template:
    metadata:
      name: {{ include "sa-platform.fullname" . }}-secrets
      labels:
        {{- include "sa-platform.labels" . | nindent 4 }}
    type: Opaque
