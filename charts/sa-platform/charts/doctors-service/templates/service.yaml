apiVersion: v1
kind: Service
metadata:
  name: {{ include "doctors-service.fullname" . }}
  labels:
    {{- include "doctors-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "doctors-service.selectorLabels" . | nindent 4 }}
---
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "doctors-service.serviceAccountName" . }}
  labels:
    {{- include "doctors-service.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "doctors-service.fullname" . }}-role
  labels:
    {{- include "doctors-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "doctors-service.fullname" . }}-rolebinding
  labels:
    {{- include "doctors-service.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "doctors-service.serviceAccountName" . }}
roleRef:
  kind: Role
  name: {{ include "doctors-service.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "doctors-service.fullname" . }}
  labels:
    {{- include "doctors-service.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "doctors-service.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "doctors-service.fullname" . }}
  labels:
    {{- include "doctors-service.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "doctors-service.selectorLabels" . | nindent 6 }}
{{- end }}
